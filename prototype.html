<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anton Kuzmenko - Senior Software Engineer</title>
    <style>
        /* --- CSS Variables (Matching Tailwind Stone Palette) --- */
        :root {
            --bg-color: #fcfbf9;
            --text-900: #1c1917;
            --text-800: #292524;
            --text-600: #57534e;
            --text-500: #78716c;
            --text-400: #a8a29e;
            --text-200: #e7e5e4;
            --text-100: #f5f5f4;
            --border-color: #d6d3d1;
            
            --font-serif: 'Georgia', 'Cambria', 'Times New Roman', Times, serif;
            --font-sans: system-ui, -apple-system, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        /* --- Reset & Base --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-800);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        ::selection {
            background: var(--border-color);
            color: var(--text-900);
        }

        /* --- Layout Utilities --- */
        .container {
            max-width: 48rem; /* ~768px */
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-12 { margin-bottom: 3rem; }
        .mt-8 { margin-top: 2rem; }
        
        /* --- Typography --- */
        h1, h2, h3 { font-family: var(--font-serif); color: var(--text-900); }
        
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        
        .font-mono { font-family: var(--font-mono); }
        .font-serif { font-family: var(--font-serif); }
        .font-bold { font-weight: 700; }
        
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.05em; }
        .tracking-tight { letter-spacing: -0.025em; }

        /* --- Specific Components --- */
        
        /* Texture Overlay */
        .texture-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.4;
            mix-blend-mode: multiply;
        }

        /* Navigation */
        nav {
            padding: 2rem 0;
            margin-bottom: 3rem;
            border-bottom: 1px solid var(--border-color);
        }
        .nav-title {
            cursor: pointer;
            text-decoration: none;
        }
        .nav-title:hover h1 { color: var(--text-600); }
        .nav-icons a {
            color: var(--text-500);
            transition: color 0.2s;
        }
        .nav-icons a:hover { color: var(--text-900); }

        /* Post List Item */
        .post-item {
            cursor: pointer;
            display: block;
            text-decoration: none;
            margin-bottom: 3rem;
        }
        .post-item:hover h2 { color: var(--text-600); }
        .post-item:hover .read-link { text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--text-400); }
        
        .post-meta {
            color: var(--text-500);
            display: flex;
            justify-content: space-between;
        }
        .read-link {
            display: flex;
            align-items: center;
            color: var(--text-800);
            font-size: 0.75rem;
        }

        /* Blog Post Detail */
        .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-500);
            display: flex;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0;
            transition: color 0.2s;
        }
        .back-btn:hover { color: var(--text-900); }
        .back-btn svg { margin-right: 0.5rem; transition: transform 0.2s; }
        .back-btn:hover svg { transform: translateX(-4px); }

        .tag {
            background-color: var(--text-200);
            color: var(--text-600);
            padding: 0.25rem 0.5rem;
            border-radius: 2px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
        }

        /* Typography Content (Prose) */
        .prose p { margin-bottom: 1.5rem; color: var(--text-800); font-size: 1.125rem; }
        .prose h3 { margin-top: 2rem; margin-bottom: 1rem; font-size: 1.5rem; }
        .prose blockquote {
            border-left: 4px solid var(--text-400);
            padding-left: 1rem;
            margin: 2rem 0;
            font-style: italic;
            color: var(--text-600);
        }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; }
        .prose pre {
            background-color: var(--text-200);
            padding: 1rem;
            border-radius: 0.375rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }
        .prose code {
            background-color: var(--text-200);
            padding: 0.1rem 0.3rem;
            border-radius: 2px;
            font-size: 0.9em;
            font-family: var(--font-mono);
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 2rem 0;
            border-top: 1px solid var(--border-color);
            color: var(--text-500);
        }
        footer a { color: inherit; text-decoration: none; margin-left: 1rem; }
        footer a:hover { color: var(--text-900); }

        /* Utilities */
        .hidden { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Contact Box */
        .contact-box {
            background-color: var(--text-100);
            border: 1px solid var(--text-200);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 2px;
        }
        .btn-primary {
            background-color: var(--text-800);
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        .btn-primary:hover { background-color: var(--text-600); }

    </style>
</head>
<body>

    <!-- Noise Texture Overlay -->
    <div class="texture-bg">
        <svg width="100%" height="100%">
            <filter id="noise">
                <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="4" stitchTiles="stitch" />
            </filter>
            <rect width="100%" height="100%" filter="url(#noise)" />
        </svg>
    </div>

    <div class="container">
        <!-- Navigation -->
        <nav class="flex justify-between items-center">
            <div class="nav-title" onclick="router.navigate('home')">
                <h1 class="text-xl font-bold tracking-tight">Anton Kuzmenko</h1>
                <p class="font-mono text-sm" style="color: var(--text-500); margin-top: 0.25rem;">Senior Software Engineer</p>
            </div>
            <div class="nav-icons flex gap-4">
                <!-- GitHub Icon -->
                <a href="#" aria-label="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
                </a>
                <!-- LinkedIn Icon -->
                <a href="#" aria-label="LinkedIn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>
                </a>
                <!-- Mail Icon -->
                <a href="#" aria-label="Email">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </a>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="app-root" class="fade-in">
            <!-- Content injected by JS -->
        </main>

        <!-- Footer -->
        <footer class="flex justify-between items-center font-mono text-sm">
            <div>&copy; 2025 Anton Kuzmenko</div>
            <div class="flex">
                <a href="#">RSS</a>
                <a href="#">Twitter</a>
                <a href="#">Polywork</a>
            </div>
        </footer>
    </div>

    <!-- Application Logic -->
    <script>
        // --- Mock Data ---
        const posts = [
            {
                id: 1,
                title: "The Myth of 'Self-Documenting' Code",
                date: "October 12, 2025",
                readTime: "6 min read",
                excerpt: "Why explicit documentation beats implicit logic, especially when you're revisiting your own codebase six months later. We often confuse readable syntax with comprehensible architecture.",
                tags: ["Engineering", "Best Practices"],
                content: `
                    <p>There is a pervasive idea in modern software development that if you name your variables well enough, and keep your functions small enough, your code becomes "self-documenting." As a senior developer, I've come to view this as a dangerous half-truth.</p>
                    <h3>The Context Gap</h3>
                    <p>Code tells you <em>how</em> something happens. It rarely tells you <em>why</em>. Variable names like <code>calculateUserRetension()</code> explain the operation, but they don't explain that we chose a 30-day rolling window because of a specific constraint in the legacy billing system.</p>
                    <p>When we rely solely on code readability, we lose the architectural decisions and the business logic constraints that shaped that code.</p>
                    <h3>A Better Approach</h3>
                    <p>I advocate for "Decision Records" alongside code. Not comprehensive specs that rot, but lightweight comments or markdown files explaining the <em>constraints</em> at the time of writing.</p>
                    <blockquote>"Code is the truth of the machine, but documentation is the truth of the intent."</blockquote>
                    <p>In the end, kindness to your future self involves leaving breadcrumbs about the <em>why</em>, not just the <em>how</em>.</p>
                `
            },
            {
                id: 2,
                title: "System Design: Simplicity as a Feature",
                date: "September 28, 2025",
                readTime: "8 min read",
                excerpt: "Complex systems fail in complex ways. Simple systems fail in obvious ways. A look at how removing moving parts increased our uptime by 99.9%.",
                tags: ["Architecture", "System Design"],
                content: `
                    <p>We love to over-engineer. It's in our nature. We see a problem and think "Microservices! Event sourcing! Kubernetes!" before we've even defined the domain boundaries.</p>
                    <p>Recently, I dismantled a distributed message queue system and replaced it with a boring, monolithic cron job. The result? Latency dropped, debugging became trivial, and we haven't had a pager incident in three months.</p>
                    <h3>Boring Technology</h3>
                    <p>There is immense value in "boring" technology. Postgres, standard HTTP REST, monolithic architectures. They are battle-tested. They have known failure modes.</p>
                    <ul>
                        <li>Fewer network hops means less latency.</li>
                        <li>Shared memory is faster than serialization.</li>
                        <li>Transactional integrity is easier in a single DB.</li>
                    </ul>
                    <p>Complexity should be introduced only when it buys you something you strictly cannot afford to live without.</p>
                `
            },
            {
                id: 3,
                title: "Async/Await in 2025: Patterns to Avoid",
                date: "August 15, 2025",
                readTime: "5 min read",
                excerpt: "Sequential loops, unhandled rejections, and the hidden costs of convenient syntax sugar in high-throughput Node.js applications.",
                tags: ["JavaScript", "Node.js"],
                content: `
                    <p>Async/await transformed JavaScript, making asynchronous code look synchronous. But this visual simplicity hides performance pitfalls.</p>
                    <h3>The Sequential Loop Trap</h3>
                    <p>The most common issue I see in code reviews is awaiting inside a loop designed to perform independent operations.</p>
                    <pre>// Don't do this
for (const user of users) {
  await sendEmail(user);
}

// Do this
await Promise.all(users.map(sendEmail));</pre>
                    <p>It seems obvious, but in complex business logic, these patterns hide deep within helper functions, serializing operations that should be parallel.</p>
                `
            }
        ];

        // --- Router & View Logic ---
        const appRoot = document.getElementById('app-root');

        const router = {
            navigate: function(view, param = null) {
                // Simple fade out/in effect
                appRoot.style.opacity = '0';
                setTimeout(() => {
                    if (view === 'home') {
                        this.renderHome();
                    } else if (view === 'post') {
                        this.renderPost(param);
                    }
                    appRoot.style.opacity = '1';
                    window.scrollTo(0, 0);
                }, 150);
            },

            renderHome: function() {
                const intro = `
                    <section class="mb-12" style="max-width: 42rem">
                        <p class="text-xl" style="color: var(--text-600); font-family: var(--font-serif);">
                            I build robust software systems and write about the process. 
                            Currently focused on simplifying distributed architectures and 
                            advocating for boring technology.
                        </p>
                    </section>
                `;

                const listHtml = posts.map(post => `
                    <article class="post-item group" onclick="router.navigate('post', ${post.id})">
                        <div class="post-meta mb-2 font-mono text-xs uppercase tracking-wide">
                            <span>${post.date}</span>
                            <span style="color: var(--text-400)">${post.readTime}</span>
                        </div>
                        <h2 class="text-xl font-bold mb-4">${post.title}</h2>
                        <p class="mb-4" style="color: var(--text-600)">${post.excerpt}</p>
                        <div class="read-link font-mono text-xs uppercase tracking-wider">
                            Read Article 
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-left: 0.5rem; transform: rotate(180deg)"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        </div>
                    </article>
                `).join('');

                appRoot.innerHTML = `<div class="fade-in">${intro}<div style="display: grid; gap: 3rem;">${listHtml}</div></div>`;
            },

            renderPost: function(postId) {
                const post = posts.find(p => p.id === postId);
                if (!post) return;

                const tagsHtml = post.tags.map(tag => `<span class="tag font-mono uppercase tracking-wide">${tag}</span>`).join('');

                const postHtml = `
                    <div class="fade-in">
                        <button onclick="router.navigate('home')" class="back-btn mb-8">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                            Back to list
                        </button>

                        <header class="mb-12">
                            <div class="flex mb-4">${tagsHtml}</div>
                            <h1 class="mb-4" style="font-size: 2.5rem; line-height: 1.2;">${post.title}</h1>
                            <div class="font-mono text-sm" style="color: var(--text-500)">
                                <span>${post.date}</span>
                                <span class="mx-2">•</span>
                                <span>${post.readTime}</span>
                            </div>
                        </header>

                        <div class="prose">
                            ${post.content}
                        </div>

                        <hr style="margin: 3rem 0; border: 0; border-top: 1px solid var(--border-color);">

                        <div class="contact-box">
                            <div>
                                <p class="font-serif font-bold mb-1">Enjoyed this read?</p>
                                <p class="text-sm" style="color: var(--text-600)">Feel free to reach out regarding this topic.</p>
                            </div>
                            <button class="btn-primary">Contact Me</button>
                        </div>
                    </div>
                `;

                appRoot.innerHTML = postHtml;
            }
        };

        // Initialize
        router.renderHome();

    </script>
</body>
</html>
