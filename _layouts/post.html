---
layout: default
---
<div class="fade-in">
  <a href="{{ "/" | relative_url }}" class="back-btn mb-8">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    Back to list
  </a>

  <header class="mb-12">
    <h1 class="mb-4" style="font-size: 2.5rem; line-height: 1.2;">{{ page.title }}</h1>
    <div class="font-mono text-sm" style="color: var(--text-500)">
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
      <span class="mx-2">•</span>
      <!-- Read time calculation could be added here -->
      <span>5 min read</span>
    </div>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <hr style="margin: 3rem 0; border: 0; border-top: 1px solid var(--border-color);">

  <div class="contact-box">
    <div>
      <p class="font-serif font-bold mb-1">Enjoyed this read?</p>
      <p class="text-sm" style="color: var(--text-600)">Feel free to reach out regarding this topic.</p>
    </div>
    <a href="mailto:{{ site.email }}" class="btn-primary" style="text-decoration: none; display: inline-block;">Contact
      Me</a>
  </div>
</div>
