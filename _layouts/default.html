<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: " en" }}" class="bg-gray-50 text-gray-800">
{% include head.html %}

<body>
  <!-- Noise Texture Overlay -->
  <div class="texture-bg">
    <svg width="100%" height="100%">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="4" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)" />
    </svg>
  </div>

  <div class="container">
    {% include header.html %}
    <main id="app-root" class="fade-in">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
</body>

</html>
